<!doctype html>
<!--
    Uploaded to the site root before a deployment and deleted immediately after.

    The ASP.NET Core module treats app_offline.htm as an instruction to stop the application
    and let go of its files. Without it, IIS keeps the running build's DLLs open and FTP
    cannot overwrite them, so a deploy half-succeeds and the site is left mixing old and new
    assemblies.
-->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SMA Library — updating</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #faf7f4;
            color: #1a1614;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 32rem;
            background: #fff;
            border: 1px solid #e7e1dc;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 24px 60px -28px rgb(16 12 8 / 0.35);
        }
        h1 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: -0.02em; }
        p { margin: 0; color: #5c534e; line-height: 1.6; }
        .mark {
            width: 56px; height: 56px; margin: 0 auto 1.25rem;
            border-radius: 50%; background: #f07c20; color: #fff;
            display: grid; place-items: center; font-size: 1.5rem; font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">SMA</div>
        <h1>Updating the library</h1>
        <p>
            The catalogue is being updated and will be back in a few minutes.
            Borrowing at the self-service station is unaffected.
        </p>
    </main>
</body>
</html>
