name: Deploy to SmarterASP.NET over FTP

# Manual by default. Deploying restarts the site and briefly takes it offline, so it
# should be a decision rather than something that happens on every push to main.
# To deploy automatically as well, uncomment the push trigger below.
on:
  workflow_dispatch:
    inputs:
      self_contained:
        description: >-
          Ship the .NET runtime with the app. Leave true unless the host's control panel
          confirms .NET 10 - the app targets net10.0 and most shared hosts do not have it
          yet. True is ~210MB, false is ~25MB.
        type: boolean
        default: true
        required: false
  # push:
  #   branches: [ main ]

concurrency:
  # Two deployments writing over FTP at once would interleave files and leave the site
  # in a state that is neither the old build nor the new one.
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Cross-publishing a Windows target from Linux is supported and keeps the job on the
      # faster, cheaper runner.
      - name: Publish
        run: |
          dotnet publish "Library Management system.csproj" \
            -c Release \
            -r win-x64 \
            --self-contained ${{ inputs.self_contained }} \
            -o ./publish

      # The repository has no appsettings.json - it is gitignored precisely so credentials
      # never land in a public repo. The deployed one is written here from secrets.
      - name: Write production configuration
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          RFID_AUTOCONNECT: ${{ secrets.RFID_AUTOCONNECT }}
          RFID_HOST: ${{ secrets.RFID_HOST }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "::error::Secret DB_CONNECTION_STRING is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # ProductionGuards.Validate refuses to start the app in Production without these,
          # and it is right to: no admin password means a known-credential administrator, and
          # no SMTP means a student who forgets a password cannot recover it. Checked here so
          # the deploy stops before uploading rather than after the app fails to start.
          if [ -z "$SMTP_SERVER" ]; then
            echo "::warning::No SMTP secrets set. Deploying with EmailSettings:AllowMissing so"
            echo "::warning::the site can run, but password reset and overdue reminders will"
            echo "::warning::not be delivered until SMTP_SERVER, SMTP_SENDER_EMAIL and"
            echo "::warning::SMTP_PASSWORD are added."
          fi

          # jq builds the JSON so a password containing quotes, backslashes or $ cannot
          # break the file or leak through shell expansion.
          jq -n \
            --arg conn "$DB_CONNECTION_STRING" \
            --arg rfidHost "${RFID_HOST:-192.168.0.178}" \
            --argjson rfidAuto "${RFID_AUTOCONNECT:-false}" \
            --arg adminPw "$SEED_ADMIN_PASSWORD" \
            --arg smtpHost "$SMTP_SERVER" \
            --argjson smtpPort "${SMTP_PORT:-587}" \
            --arg smtpFrom "$SMTP_SENDER_EMAIL" \
            --arg smtpPw "$SMTP_PASSWORD" \
            '{
              ConnectionStrings: { DefaultConnection: $conn },
              Logging: { LogLevel: { Default: "Warning", "Microsoft.AspNetCore": "Warning", "Microsoft.EntityFrameworkCore": "Warning" } },
              AllowedHosts: "*",
              Rfid: {
                Provider: "D2184",
                Host: $rfidHost,
                Port: 4001,
                ReaderAddress: 1,
                AutoConnect: $rfidAuto,
                HeartbeatSeconds: 15,
                ReconnectDelaySeconds: 5,
                MaxReconnectDelaySeconds: 60,
                DuplicateWindowMs: 2500
              },
              LibraryHours: {
                WeekdayOpen: "07:30", WeekdayClose: "20:30",
                WeekendOpen: "07:30", WeekendClose: "16:30",
                Note: "Except public holidays."
              },
              SeedAdmin: { Email: "admin@sourceemeall.com", Enabled: false, ResetPasswordOnStartup: false },
              EmailSettings: { SmtpServer: $smtpHost, SmtpPort: $smtpPort, SenderEmail: $smtpFrom, Password: $smtpPw, AllowMissing: ($smtpHost == "") },
              SeedSampleData: { Enabled: false },
              SeedDemoUsers: { Enabled: false },
              SeedStudentAccounts: { Enabled: false },
              Catalogue: { FreshImport: false, FreshImportFile: "Data/Seed/rfid-book-tags.csv" },
              CredentialReset: { Enabled: false }
            }' > ./publish/appsettings.json

          rm -f ./publish/appsettings.Development.json

          # Fail loudly rather than shipping a config that silently points nowhere.
          grep -q '"DefaultConnection"' ./publish/appsettings.json || { echo "::error::config not written"; exit 1; }
          echo "Configuration written. Connection string length: ${#DB_CONNECTION_STRING}"

      # The target folder is not a credential, and masking it as a secret made every
      # diagnostic print *** exactly when the path was the thing in doubt. It is read from a
      # repository variable first so it shows in the log; the secret still works as a
      # fallback. The trailing slash is added here because the deploy action rejects a path
      # without one, which is a silly thing to fail a five-minute job on.
      - name: Resolve target folder
        id: dir
        run: |
          raw="${{ vars.FTP_SERVER_DIR }}"
          if [ -z "$raw" ]; then raw="${{ secrets.FTP_SERVER_DIR }}"; fi
          if [ -z "$raw" ]; then raw="/"; fi

          case "$raw" in */) dir="$raw" ;; *) dir="$raw/" ;; esac
          case "$dir" in /*) ;; *) dir="/$dir" ;; esac

          echo "path=$dir" >> "$GITHUB_OUTPUT"
          if [ -n "${{ vars.FTP_SERVER_DIR }}" ]; then
            echo "Target folder: $dir"
          else
            echo "Target folder resolved from the secret (value hidden). Move it to a repository"
            echo "variable named FTP_SERVER_DIR to see it here."
          fi

      # Login and path are the two things that go wrong, and both are cheap to check. Doing it
      # here turns a 530 or a wrong folder into a ten-second failure with the remote listing in
      # the log, instead of a failure after pushing 210MB.
      - name: Preflight - check login and target folder
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          out=$(lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            set net:max-retries 1;
            set net:timeout 20;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            pwd;
            echo '--- home ---';
            cls -1;
            echo '--- target ---';
            cd '${{ steps.dir.outputs.path }}';
            pwd;
            cls -1;
          " 2>&1) || {
            echo "$out"
            echo "::error::FTP preflight failed. 530 means the username or password is wrong, or that"
            echo "::error::FTP user does not exist. A 'cd' failure means FTP_SERVER_DIR is wrong for"
            echo "::error::this user - remember it is relative to that FTP user's own home path."
            exit 1
          }

          echo "Remote listing of ${{ steps.dir.outputs.path }}:"
          echo "$out"

          # lftp returns 0 even when a cd fails, so the transcript has to be read. Without
          # this the job sails on and the deploy action creates the missing folder, which is
          # how 210MB once landed in a directory IIS does not serve.
          if echo "$out" | grep -qiE "Access failed|550 "; then
            echo "::error::Could not enter the target folder - it does not exist for this FTP"
            echo "::error::user. FTP_SERVER_DIR is relative to that user home, listed above as"
            echo "::error::--- home ---. If the site files are in the home itself, set it to /"
            exit 1
          fi

          # web.config is the marker that this is the folder IIS serves the app from.
          if echo "$out" | grep -qi 'web.config'; then
            echo "Found web.config - this looks like the site root."
          else
            echo "::warning::No web.config here yet. Fine for a first deploy; if this is not the"
            echo "::warning::folder the site is served from, the upload will go nowhere useful."
          fi

      # IIS holds the application's own DLLs open while it is running, so FTP cannot
      # overwrite them. app_offline.htm makes the ASP.NET Core module shut the app down and
      # release the files; removing it afterwards starts the new build.
      # FTP_SERVER_DIR is the path relative to the FTP account's home, not the physical path
      # the file manager shows. The account lands in its own home directory and the site sits
      # in www/library under it, so the secret value is /www/library/ .
      - name: Take the site offline
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.dir.outputs.path }}
          # Overridable without touching this file: add a repository variable
          # FTP_PROTOCOL = ftps if the host insists on explicit TLS.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./.github/offline/
          dangerous-clean-slate: false

      - name: Upload the build
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.dir.outputs.path }}
          # Overridable without touching this file: add a repository variable
          # FTP_PROTOCOL = ftps if the host insists on explicit TLS.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./publish/
          # The action keeps a manifest on the server and uploads only what changed, so the
          # first deploy is slow and later ones are not.
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/*.pdb

      # Removing app_offline.htm is what brings the new build up, so it must run even if the
      # upload failed - otherwise a failed deploy leaves the site permanently offline.
      - name: Bring the site back online
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            cd '${{ steps.dir.outputs.path }}';
            rm -f app_offline.htm;
          " || echo "::warning::Could not remove app_offline.htm. Delete it by hand or the site stays offline."


      - name: Check the site responds
        run: |
          url="${{ secrets.SITE_URL }}"
          if [ -z "$url" ]; then echo "SITE_URL secret not set; skipping check."; exit 0; fi

          # The first request after a restart pays for JIT and the EF migration, so allow time.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              # The host answers 200 with its own placeholder page, so the status code alone
              # proves nothing. Look for markup only this application emits.
              if curl -s --max-time 60 "$url" | grep -q "sma-nav"; then
                echo "Site is up and serving the application."; exit 0
              fi
              echo "200, but this is not the application - most likely the host placeholder,"
              echo "which means the upload went to a folder IIS does not serve."
            fi
            sleep 20
          done

          echo "::error::Site did not return 200. Check $url and the stdout log on the server."
          exit 1
      # The only account of a startup failure lives on the server, and reading it by hand over
      # FTP after every attempt is the slow way to debug this. Pulled into the job output
      # instead, and only when something is actually wrong.
      - name: Fetch the server startup log
        if: failure()
        run: |
          which lftp >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; }

          mkdir -p serverlogs
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate false;
            set net:max-retries 1;
            set net:timeout 25;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            cd '${{ steps.dir.outputs.path }}';
            lcd serverlogs;
            mget -E logs/*.log;
          " 2>&1 | tail -5 || echo "No logs directory on the server yet."

          if ls serverlogs/*.log >/dev/null 2>&1; then
            for f in serverlogs/*.log; do
              echo "================ $f ================"
              # The interesting part of an ASP.NET Core startup failure is the tail.
              tail -c 6000 "$f"
              echo
            done
          else
            echo "Nothing was written to logs/. If the site returns an empty 503 with no log at"
            echo "all, the module could not start the process - check that the application pool"
            echo "is set to 'No Managed Code' and note whether it is 32-bit, which an x64"
            echo "self-contained build cannot load in-process."
          fi
